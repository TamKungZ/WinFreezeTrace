name: Publish to winget

# Manual only: Actions > Publish to winget > Run workflow, with the release tag (e.g. v0.8.0).
# Downloads the Setup installers of that GitHub release, writes the winget manifests from them
# and opens a PR against microsoft/winget-pkgs. Works for the first version of the package too.
#
# One-time setup:
#   1. Fork microsoft/winget-pkgs under the account that owns the token.
#   2. Add a classic PAT with the public_repo scope as the repository secret WINGET_TOKEN.
#   3. Optional: repository variable WINGET_IDENTIFIER if the package id is not TamKungZ.WinFreezeTrace.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish, e.g. v0.8.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  winget:
    name: winget-pkgs PR
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag }}
      IDENTIFIER: ${{ vars.WINGET_IDENTIFIER || 'TamKungZ.WinFreezeTrace' }}
      GH_TOKEN: ${{ github.token }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Download the release installers
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "'$env:TAG' is not a stable vX.Y.Z tag." }
          if (-not $env:WINGET_TOKEN) { throw 'Secret WINGET_TOKEN is not set.' }
          $json = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isPrerelease,publishedAt | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Release $env:TAG not found" }
          if ($json.isPrerelease) { throw 'Pre-releases are not published to winget.' }
          "RELEASE_DATE=$(([datetime]$json.publishedAt).ToString('yyyy-MM-dd'))" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force installers | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern 'WinFreezeTrace-Setup-*-*.exe' --dir installers
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          Get-ChildItem installers | ForEach-Object { $_.Name }

      - name: Write the manifests
        shell: pwsh
        run: |
          $version = $env:TAG.Substring(1)
          $id = $env:IDENTIFIER
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG"
          $schema = 'https://aka.ms/winget-manifest.{0}.1.6.0.schema.json'
          $out = New-Item -ItemType Directory -Force "manifest"

          $installers = foreach ($arch in 'x64', 'x86') {
            $file = Get-Item "installers/WinFreezeTrace-Setup-$version-$arch.exe" -ErrorAction SilentlyContinue
            if (-not $file) { Write-Warning "No $arch installer in the release."; continue }
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
            @("- Architecture: $arch", "  InstallerUrl: $base/$($file.Name)", "  InstallerSha256: $hash")
          }
          if (-not $installers) { throw 'No installers found.' }

          $header = "PackageIdentifier: $id", "PackageVersion: $version"

          $versionManifest = $header + "DefaultLocale: en-US", "ManifestType: version", "ManifestVersion: 1.6.0"
          $versionManifest = "# yaml-language-server: `$schema=$($schema -f 'version')", '' + $versionManifest

          $installerManifest = $header + @(
            'MinimumOSVersion: 10.0.17763.0',
            'InstallerType: nullsoft',
            'Scope: machine',
            'InstallModes:', '- interactive', '- silent', '- silentWithProgress',
            'ProductCode: WinFreezeTrace',
            "ReleaseDate: $env:RELEASE_DATE",
            'Installers:') + $installers + @('ManifestType: installer', 'ManifestVersion: 1.6.0')
          $installerManifest = "# yaml-language-server: `$schema=$($schema -f 'installer')", '' + $installerManifest

          $localeManifest = $header + @(
            'PackageLocale: en-US',
            'Publisher: TamKungZ_',
            'PublisherUrl: https://github.com/TamKungZ',
            'PublisherSupportUrl: https://github.com/TamKungZ/WinFreezeTrace/issues',
            'PackageName: WinFreezeTrace',
            'PackageUrl: https://github.com/TamKungZ/WinFreezeTrace',
            'License: 0BSD',
            'LicenseUrl: https://github.com/TamKungZ/WinFreezeTrace/blob/main/LICENSE',
            'ShortDescription: Background recorder that captures diagnostic reports when Windows stalls or an app stops responding.',
            'Tags:', '- diagnostics', '- freeze', '- hang', '- troubleshooting',
            "ReleaseNotesUrl: https://github.com/TamKungZ/WinFreezeTrace/releases/tag/$env:TAG",
            'ManifestType: defaultLocale', 'ManifestVersion: 1.6.0')
          $localeManifest = "# yaml-language-server: `$schema=$($schema -f 'defaultLocale')", '' + $localeManifest

          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText("$out/$id.yaml", (($versionManifest -join "`n") + "`n"), $utf8)
          [IO.File]::WriteAllText("$out/$id.installer.yaml", (($installerManifest -join "`n") + "`n"), $utf8)
          [IO.File]::WriteAllText("$out/$id.locale.en-US.yaml", (($localeManifest -join "`n") + "`n"), $utf8)
          Get-Content "$out/$id.installer.yaml"

      - name: Open the winget-pkgs PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $version = $env:TAG.Substring(1)
          $id = $env:IDENTIFIER
          $upstream = 'microsoft/winget-pkgs'
          $me = gh api user --jq .login
          $fork = "$me/winget-pkgs"
          gh api "repos/$fork" --jq .full_name | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fork $fork not found. Fork $upstream first." }

          $branch = "$id-$version"
          $sha = gh api "repos/$upstream/git/ref/heads/master" --jq .object.sha
          gh api "repos/$fork/git/refs" -f "ref=refs/heads/$branch" -f "sha=$sha" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not create branch $branch on $fork (does it already exist?)" }

          $parts = $id.Split('.')
          $dir = "manifests/$($parts[0].Substring(0,1).ToLower())/$($parts -join '/')/$version"
          foreach ($f in Get-ChildItem manifest) {
            $content = [Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName))
            gh api -X PUT "repos/$fork/contents/$dir/$($f.Name)" -f "message=New version: $id version $version" -f "content=$content" -f "branch=$branch" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not upload $($f.Name)" }
          }

          $kind = 'New version'
          gh api "repos/$upstream/contents/manifests/$($parts[0].Substring(0,1).ToLower())/$($parts -join '/')" --silent 2>$null
          if ($LASTEXITCODE -ne 0) { $kind = 'New package' }
          $summary = "Adds $id $version from https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:TAG"
          $template = gh api -H 'Accept: application/vnd.github.raw' "repos/$upstream/contents/.github/PULL_REQUEST_TEMPLATE.md" 2>$null
          $body = if ($LASTEXITCODE -eq 0 -and $template) { "$summary`n`n---`n`n" + ($template -join "`n") } else { $summary }
          gh pr create --repo $upstream --head "${me}:$branch" --base master --title "${kind}: $id version $version" --body $body
          if ($LASTEXITCODE -ne 0) { throw 'Could not open the pull request' }
