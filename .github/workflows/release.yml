name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, e.g. v0.5.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: x86
            cmake_arch: Win32
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v(\d+)\.(\d+)\.(\d+)') { throw "Tag '$env:TAG' must look like v1.2.3" }
          $num = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          "VERSION=$($env:TAG.Substring(1))" >> $env:GITHUB_ENV
          "VERSION_NUM=$num.0" >> $env:GITHUB_ENV
          $cm = (Select-String -Path CMakeLists.txt -Pattern 'project\(WinFreezeTrace VERSION ([\d.]+)').Matches.Groups[1].Value
          if ($cm -ne $num) { Write-Warning "Tag version $num differs from CMakeLists.txt version $cm (the exe will report $cm)." }

      - name: Configure (MSVC ${{ matrix.arch }})
        shell: pwsh
        run: |
          $tests = if (Test-Path tests/test_core.c) { 'ON' } else { 'OFF' }
          cmake -S . -B build -A ${{ matrix.cmake_arch }} -DWFT_BUILD_TESTS="$tests"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        shell: pwsh
        run: |
          if (Test-Path tests/test_core.c) { ctest --test-dir build -C Release --output-on-failure }
          else { Write-Host 'No tests/ directory, skipping.' }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish WinFreezeTrace Manager (WinUI 3, self-contained)
        shell: pwsh
        run: |
          dotnet publish manager/WinFreezeTraceManager/WinFreezeTraceManager.csproj -c Release `
            -r win-${{ matrix.arch }} -p:Platform=${{ matrix.arch }} -p:Version=$env:VERSION_NUM -o manager-out
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed ($LASTEXITCODE)" }
          if (-not (Test-Path manager-out/WinFreezeTraceManager.exe)) { throw 'WinFreezeTraceManager.exe was not produced' }

      - name: Ensure NSIS
        shell: pwsh
        run: |
          $dir = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$dir\makensis.exe")) { choco install nsis -y --no-progress }
          if (-not (Test-Path "$dir\makensis.exe")) { throw 'makensis.exe not found' }
          $dir >> $env:GITHUB_PATH

      - name: Build NSIS installer (admin, per-machine)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $out = Join-Path $PWD "dist/WinFreezeTrace-Setup-$env:VERSION-${{ matrix.arch }}.exe"
          $exe = Join-Path $PWD "build/Release/WinFreezeTrace.exe"
          $dll = Join-Path $PWD "build/Release/WinFreezeTraceCore.dll"
          makensis /V2 "/DARCH=${{ matrix.arch }}" "/DEXE=$exe" "/DDLL=$dll" "/DMGRDIR=$PWD\manager-out" "/DVERSION=$env:VERSION" "/DVERSION_NUM=$env:VERSION_NUM" "/DSRCDIR=$PWD" "/DOUTFILE=$out" installer/WinFreezeTrace.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }

      - name: Portable zip
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build/Release/WinFreezeTrace.exe, build/Release/WinFreezeTraceCore.dll, LICENSE, TERMS.txt, PRIVACY.txt, README.md, CHANGELOG.md, install_task.cmd, uninstall_task.cmd, register_task.ps1 $stage
          Copy-Item manager-out (Join-Path $stage 'Manager') -Recurse
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/WinFreezeTrace-$env:VERSION-win-${{ matrix.arch }}.zip" -Force

      - name: Build MSIX package
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $p = @{
            Arch       = '${{ matrix.arch }}'
            Version    = $env:VERSION_NUM
            Exe        = Join-Path $PWD 'build/Release/WinFreezeTrace.exe'
            Dll        = Join-Path $PWD 'build/Release/WinFreezeTraceCore.dll'
            ManagerDir = Join-Path $PWD 'manager-out'
            Out        = Join-Path $PWD 'msix-out/WinFreezeTrace-${{ matrix.arch }}.msix'
          }
          if ($env:MSIX_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'msix.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_PFX_BASE64))
            $p.Pfx = $pfx
            $p.PfxPassword = $env:MSIX_PFX_PASSWORD
          }
          & installer/msix/pack-msix.ps1 @p

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Upload MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.arch }}
          path: msix-out/*.msix
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Download MSIX packages
        uses: actions/download-artifact@v4
        with:
          pattern: msix-*
          path: msix-out
          merge-multiple: true

      - name: Build MSIX bundle
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)') { throw "Tag '$env:TAG' must look like v1.2.3" }
          $bundleVersion = "$($Matches[1]).0"
          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $kit) { throw 'makeappx.exe not found' }
          $out = Join-Path $PWD "dist/WinFreezeTrace-$($env:TAG.Substring(1)).msixbundle"
          & $kit.FullName bundle /d msix-out /p $out /bv $bundleVersion /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx bundle failed ($LASTEXITCODE)" }
          if ($env:MSIX_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'msix.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_PFX_BASE64))
            & (Join-Path $kit.DirectoryName 'signtool.exe') sign /fd SHA256 /f $pfx /p $env:MSIX_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $out
            if ($LASTEXITCODE -ne 0) { throw "signtool failed ($LASTEXITCODE)" }
            Remove-Item $pfx -Force
          } else {
            Write-Warning 'MSIX_PFX_BASE64 is not set: the bundle is unsigned and cannot be installed until it is signed.'
          }

      - name: Checksums
        shell: pwsh
        run: |
          Push-Location dist
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Pop-Location
          Get-ChildItem dist | Format-Table Name, Length

      - name: Publish release
        shell: pwsh
        run: |
          $ver = $env:TAG.Substring(1)
          $extra = @()
          if ($env:TAG -match '-') { $extra += '--prerelease' }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --verify-tag --title "WinFreezeTrace $ver" --generate-notes @extra
            if ($LASTEXITCODE -ne 0) { throw 'release create failed' }
          }
          gh release upload $env:TAG (Get-ChildItem dist -File).FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'release upload failed' }
          